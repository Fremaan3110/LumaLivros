<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lume - Meu Diário Literário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Lume<span>.</span></h1>
        <p>Onde histórias se tornam estrelas</p>
    </header>

    <main class="estante">
        
        <article class="livro-card">
            <div class="livro-capa">
                <img src="https://m.media-amazon.com/images/I/81m9fP+L7tL._AC_UF1000_1000_QL80_.jpg" alt="Capa do livro A Biblioteca da Meia-Noite">
            </div>
            
            <div class="livro-info">
                <h2>A Biblioteca da Meia-Noite</h2>
                <span class="genero-tag">Ficção</span>
                
                <div class="estrelas">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>

                <p class="resenha-texto">
                    "Entre a vida e a morte existe uma biblioteca..." Uma leitura incrivelmente reflexiva sobre os arrependimentos da vida e o que realmente importa para sermos felizes. Favoritado com certeza!
                </p>
            </div>
        </article>

    </main>

</body>
</html>
